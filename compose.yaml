services:
  wizz:
    build: .
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env or Portainer environment variables}
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
